<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entradas y salidas | DataSecure Stock</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="disposicion">
    <header class="barra-superior"></header>
    <nav class="menu-lateral" aria-label="Menu principal"></nav>
    <main class="contenido">
      <h2>Entradas y salidas de stock</h2>
      <p class="bajada">Cada movimiento descuenta o suma existencias y deja su registro inmutable en la auditoria.</p>
      <div class="aviso" id="aviso" hidden></div>
      <section class="panel">
        <h3>Registrar movimiento</h3>
        <form id="form-movimiento">
          <div class="barra-acciones">
            <div class="campo"><label for="m-producto">Producto</label><select id="m-producto" required></select></div>
            <div class="campo"><label for="m-tipo">Operacion</label>
              <select id="m-tipo" required><option value="Entrada">Entrada</option><option value="Salida">Salida</option></select></div>
            <div class="campo"><label for="m-cantidad">Cantidad</label>
              <input type="number" id="m-cantidad" min="1" max="10000" value="1" required></div>
            <div class="campo"><label for="m-obs">Observacion</label>
              <input type="text" id="m-obs" maxlength="240" placeholder="Guia de despacho, orden de compra..."></div>
            <button type="submit" id="btn-registrar">Registrar</button>
          </div>
        </form>
      </section>
      <section class="panel">
        <h3>Historial de movimientos</h3>
        <div class="barra-acciones">
          <div class="campo"><label for="f-tipo">Filtrar por operacion</label>
            <select id="f-tipo"><option value="">Todas</option><option value="Entrada">Entrada</option><option value="Salida">Salida</option></select></div>
        </div>
        <div class="tabla-envoltura">
          <table>
            <thead><tr><th>Fecha</th><th>Producto</th><th>Operacion</th>
              <th class="numero">Cantidad</th><th class="numero">Stock resultante</th><th>Responsable</th><th>Observacion</th></tr></thead>
            <tbody id="tb-movimientos"></tbody>
          </table>
        </div>
        <p class="vacio" id="paginacion"></p>
      </section>
    </main>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="js/comun.js"></script>
  <script src="js/movimientos.js"></script>
</body>
</html>
