<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar acceso | DataSecure Stock</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="pantalla-acceso">
  <main class="tarjeta-acceso">
    <header>
      <h1>Recuperar acceso</h1>
      <p>Se enviara un enlace de un solo uso al correo registrado</p>
    </header>
    <form id="form-recuperar" novalidate>
      <div class="aviso" id="aviso" hidden></div>
      <div class="campo">
        <label for="email">Correo electronico</label>
        <input type="email" id="email" name="email" placeholder="usuario@tecnosur.cl" required autocomplete="username">
      </div>
      <button type="submit" id="btn-enviar">Enviar enlace de recuperacion</button>
      <p class="enlace-pie"><a href="index.html">Volver al inicio de sesion</a></p>
    </form>
  </main>
  <script src="js/comun.js"></script>
  <script src="js/recuperar.js"></script>
</body>
</html>
