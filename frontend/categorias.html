<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categorías | DataSecure Stock</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="disposicion">
    <header class="barra-superior"></header>
    <nav class="menu-lateral" aria-label="Menú principal"></nav>
    <main class="contenido">
      <h2>Categorías de inventario</h2>
      <p class="bajada">Clasificación del catálogo. La modificación está reservada al perfil Administrador.</p>
      <div class="aviso" id="aviso" hidden></div>
      <section class="panel">
        <div class="barra-acciones">
          <div class="campo"><label for="buscar">Buscar</label><input type="search" id="buscar" placeholder="Nombre de categoría"></div>
          <button type="button" id="btn-nuevo">Nueva categoría</button>
        </div>
        <div class="tabla-envoltura">
          <table>
            <thead><tr><th>Categoría</th><th>Descripción</th><th>Estado</th><th>Acciones</th></tr></thead>
            <tbody id="tb-categorias"></tbody>
          </table>
        </div>
      </section>
      <dialog id="dlg-categoria">
        <header id="dlg-titulo">Nueva categoría</header>
        <form id="form-categoria" method="dialog">
          <div class="aviso aviso-error" id="dlg-aviso" hidden></div>
          <div class="campo"><label for="f-nombre">Nombre</label>
            <input type="text" id="f-nombre" required minlength="3" maxlength="60"></div>
          <div class="campo"><label for="f-descripcion">Descripción</label>
            <input type="text" id="f-descripcion" maxlength="240"></div>
          <footer>
            <button type="button" class="boton-secundario" id="btn-cancelar">Cancelar</button>
            <button type="submit">Guardar</button>
          </footer>
        </form>
      </dialog>
    </main>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="js/comun.js"></script>
  <script src="js/categorias.js"></script>
</body>
</html>
