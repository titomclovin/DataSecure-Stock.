<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso | DataSecure Stock</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="pantalla-acceso">
  <main class="tarjeta-acceso">
    <header>
      <h1>DataSecure Stock</h1>
      <p>Gestion inteligente de inventario y seguridad de datos</p>
    </header>
    <form id="form-login" novalidate>
      <div class="aviso aviso-error" id="aviso" hidden></div>
      <div class="campo">
        <label for="email">Correo electronico</label>
        <input type="email" id="email" name="email" placeholder="usuario@tecnosur.cl" required autocomplete="username">
      </div>
      <div class="campo">
        <label for="password">Contrasena</label>
        <input type="password" id="password" name="password" placeholder="Minimo 8 caracteres" minlength="8" required autocomplete="current-password">
      </div>
      <button type="submit" id="btn-entrar">Iniciar sesion segura</button>
      <p class="enlace-pie"><a href="recuperar.html">Olvide mi contrasena</a></p>
    </form>
  </main>
  <script src="js/comun.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
