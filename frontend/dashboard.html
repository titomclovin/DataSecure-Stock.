<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de analisis | DataSecure Stock</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="disposicion">
    <header class="barra-superior"></header>
    <nav class="menu-lateral" aria-label="Menu principal"></nav>
    <main class="contenido">
      <h2>Panel de analisis</h2>
      <p class="bajada">Indicadores calculados con agregaciones sobre las colecciones de inventario y de telemetria.</p>
      <div class="aviso" id="aviso" hidden></div>
      <section class="rejilla-indicadores" id="indicadores"></section>
      <section class="panel">
        <h3>Unidades en stock por categoria</h3>
        <div class="grafico" id="gr-categorias"></div>
      </section>
      <section class="panel">
        <h3>Movimientos de los ultimos 14 dias</h3>
        <div class="grafico" id="gr-movimientos"></div>
      </section>
      <section class="panel">
        <h3>Alertas de ciberseguridad abiertas</h3>
        <div class="tabla-envoltura">
          <table>
            <thead><tr><th>Deteccion</th><th>Amenaza</th><th>Severidad</th><th>Descripcion</th></tr></thead>
            <tbody id="tb-alertas"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="js/comun.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
