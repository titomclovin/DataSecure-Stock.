<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nueva contrasena | DataSecure Stock</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="pantalla-acceso">
  <main class="tarjeta-acceso">
    <header>
      <h1>Definir nueva contrasena</h1>
      <p>El enlace vence 30 minutos despues de solicitarlo</p>
    </header>
    <form id="form-restablecer" novalidate>
      <div class="aviso" id="aviso" hidden></div>
      <div class="campo">
        <label for="password">Nueva contrasena</label>
        <input type="password" id="password" minlength="8" required placeholder="Minimo 8 caracteres" autocomplete="new-password">
      </div>
      <div class="campo">
        <label for="password2">Repetir contrasena</label>
        <input type="password" id="password2" minlength="8" required placeholder="Repita la contrasena" autocomplete="new-password">
      </div>
      <button type="submit" id="btn-guardar">Guardar contrasena</button>
      <p class="enlace-pie"><a href="index.html">Volver al inicio de sesion</a></p>
    </form>
  </main>
  <script src="js/comun.js"></script>
  <script src="js/restablecer.js"></script>
</body>
</html>
